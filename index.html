<!--
  index.html — Pagina principale del gioco "Guardie e Ladri".
  Questo file contiene solo la "cornice" del gioco in stile cabinato arcade:
  titolo al neon, barra dei punteggi (HUD), l'area di disegno (canvas) con
  effetto schermo CRT, il pulsante "INSERT COIN" per iniziare e le istruzioni.
  Tutta la logica di gioco (movimento, criminali, cella, punteggio, animazioni)
  sta in main.js, che viene caricato in fondo alla pagina.
-->
<!-- Dichiara che il documento è HTML5 (il browser usa la modalità standard) -->
<!DOCTYPE html>
<!-- Radice del documento; lang="it" indica che il contenuto è in italiano (utile per accessibilità e motori di ricerca) -->
<html lang="it">
<!-- <head>: metadati e stili, non visibili direttamente nella pagina -->
<head>
  <!-- Codifica dei caratteri UTF-8: permette accenti (à, è) ed emoji (🕵️) -->
  <meta charset="UTF-8">
  <!-- Rende la pagina adatta ai dispositivi mobili: larghezza = schermo, zoom iniziale 100% -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Testo mostrato nella scheda del browser -->
  <title>Guardie e Ladri</title>
  <!-- Font "pixel" in stile sala giochi anni '80, caricato da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Fogli di stile CSS incorporati nella pagina -->
  <style>
    /* Pagina: sfondo nero con una leggera luce blu al centro (come la sala giochi al buio),
       font pixel, tutto centrato */
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #0d1030 0%, #000 70%);
      color: #f3f4f6;
      font-family: "Press Start 2P", monospace;
      text-align: center;
    }
    /* Titolo al neon: giallo con alone magenta che "sfarfalla" ogni tanto */
    h1 {
      margin: 22px 0 14px;
      font-size: clamp(14px, 3.4vw, 28px);
      line-height: 1.5;
      color: #fde047;
      text-shadow: 0 0 4px #fde047, 0 0 12px #f0abfc, 0 0 24px #d946ef, 3px 3px 0 #9d174d;
      animation: flicker 5s infinite;
    }
    @keyframes flicker {
      0%, 92%, 96%, 100% { opacity: 1; }
      94% { opacity: 0.55; }
    }
    /* Barra dei punteggi sopra lo schermo: tre colonne (livello, vite, stato) */
    .hud {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin: 0 auto 10px;
      max-width: 95vw;
      font-size: 11px;
    }
    .hud div { display: flex; flex-direction: column; gap: 6px; }
    /* Etichette piccole rosse come "1UP" e "HIGH SCORE" dei vecchi cabinati */
    .hud .label { color: #f87171; font-size: 9px; letter-spacing: 1px; }
    .hud p { margin: 0; color: #fff; }
    /* Cornice dello schermo: bordo al neon azzurro con alone */
    .screen {
      position: relative;
      display: inline-block;
      max-width: 95vw;
      padding: 6px;
      border: 4px solid #22d3ee;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 10px #22d3ee, 0 0 30px rgba(34, 211, 238, 0.45), inset 0 0 12px rgba(34, 211, 238, 0.4);
    }
    /* Area di gioco: si adatta allo schermo mantenendo le proporzioni;
       "pixelated" evita che i pixel degli sprite vengano sfocati quando il canvas viene ridimensionato */
    canvas {
      display: block;
      max-width: calc(95vw - 20px);
      height: auto;
      background: #000;
      image-rendering: pixelated;
    }
    /* Effetto "scanline" dei vecchi monitor CRT: righe orizzontali scure sovrapposte al gioco.
       pointer-events:none fa sì che non blocchino i clic */
    .screen::after {
      content: "";
      position: absolute;
      inset: 6px;
      pointer-events: none;
      border-radius: 4px;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.45) 100%);
    }
    /* Testo di stato sotto lo schermo, giallo come i messaggi "READY!" */
    #status { margin: 14px auto 6px; max-width: 95vw; font-size: 10px; line-height: 1.8; color: #fde047; }
    /* Istruzioni: piccole e grigie */
    .help { margin: 6px auto; max-width: 95vw; font-size: 9px; line-height: 1.8; color: #94a3b8; }
    /* Pulsante in stile pixel: magenta con bordo "a gradini" e ombra squadrata;
       quando lo premi si abbassa di qualche pixel */
    button {
      margin: 10px;
      padding: 12px 18px;
      border: 0;
      background: #d946ef;
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 4px 0 #86198f, 0 0 14px rgba(217, 70, 239, 0.6);
      text-shadow: 2px 2px 0 #701a75;
    }
    button:hover { background: #e879f9; }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 #86198f, 0 0 14px rgba(217, 70, 239, 0.6); }
    /* Il pulsante "INSERT COIN" lampeggia come la scritta dei cabinati che invita a mettere la moneta */
    #restart { animation: coin 1.2s steps(1) infinite; }
    @keyframes coin {
      0%, 100% { box-shadow: 0 4px 0 #86198f, 0 0 18px rgba(217, 70, 239, 0.9); }
      50% { box-shadow: 0 4px 0 #86198f, 0 0 4px rgba(217, 70, 239, 0.3); }
    }
  </style>
</head>
<!-- <body>: tutto ciò che è visibile nella pagina -->
<body>
  <!-- Titolo del gioco -->
  <h1>GUARDIE E LADRI</h1>
  <!-- Barra dei punteggi: main.js aggiorna "level-info" e "lives" tramite il loro id -->
  <div class="hud">
    <div><span class="label">LIVELLO</span><p id="level-info">Livello 1</p></div>
    <div><span class="label">VITE</span><p id="lives">❤️❤️❤️</p></div>
  </div>
  <!-- La "tela" su cui main.js disegna il gioco. width/height sono la risoluzione interna
       (main.js la adatta alla mappa del livello); la dimensione a schermo la decide il CSS.
       Il contenitore .screen aggiunge cornice al neon ed effetto scanline -->
  <div class="screen"><canvas id="game" width="760" height="520"></canvas></div>
  <!-- Riga di stato: main.js la aggiorna (tramite id="status") con arresti e punteggio -->
  <p id="status">Criminali in libertà: 4</p>
  <!-- Pulsante per iniziare una nuova partita; main.js lo trova tramite id="restart" e gli collega l'azione -->
  <div><button id="restart">INSERT COIN</button></div>
  <!-- Istruzioni per il giocatore -->
  <p class="help">FRECCE O WASD PER MUOVERTI - ESC PER LA PAUSA<br>RAGGIUNGI I CRIMINALI PRIMA CHE FUGGANO DALLE USCITE!</p>
  <!-- Carica la logica del gioco come modulo JavaScript (eseguito dopo la lettura della pagina) -->
  <script type="module" src="main.js"></script>
</body>
</html>
